<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Session Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23171b21'/%3E%3Crect x='6' y='7' width='5' height='14' rx='1.5' fill='%234c8dff'/%3E%3Crect x='13.5' y='7' width='5' height='10' rx='1.5' fill='%23f5a623'/%3E%3Crect x='21' y='7' width='5' height='7' rx='1.5' fill='%2335c46b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#viewPanels">Skip to the current view</a>

  <!-- Row 1: identity, the view tabs, and the two controls that mean the same
       thing on every tab. Everything that only acts on the board moved down to
       .toolbar, so switching to Projects or Archive doesn't leave five board
       filters sitting above a view they cannot filter. -->
  <header class="topbar">
    <h1><span class="dot"></span> Claude Sessions</h1>

    <div class="tabs" role="tablist" aria-label="Dashboard views">
      <button type="button" class="tab" role="tab" id="tabBoard"
              aria-controls="boardView" aria-selected="true">
        Board <span class="tab-count" id="tabCountBoard"></span>
      </button>
      <button type="button" class="tab" role="tab" id="tabProjects"
              aria-controls="projectsSection" aria-selected="false" tabindex="-1">
        Projects <span class="tab-count" id="tabCountProjects"></span>
      </button>
      <button type="button" class="tab" role="tab" id="tabArchive"
              aria-controls="archiveSection" aria-selected="false" tabindex="-1">
        Archive <span class="tab-count" id="tabCountArchive"></span>
      </button>
    </div>

    <span class="spacer"></span>

    <label class="toggle" title="Desktop notification when a card lands in Needs Input or Ready for Review"><input type="checkbox" id="notifyToggle"> 🔔 Notify</label>
    <span class="refresh-note" id="refreshNote"></span>

    <!-- Row 2, inside the same sticky header: board-only controls. Hidden
         outright on the other tabs. -->
    <div class="toolbar" id="boardToolbar">
      <!-- A combobox rather than a <select>: the list is one row per project
           folder ever opened, which grows past the point where a native
           dropdown's first-letter matching is any help. Input + listbox is the
           ARIA 1.2 pattern; app.js owns the keyboard behaviour. -->
      <span class="control combo" id="projectCombo">
        <label for="projectFilter">Project</label>
        <span class="combo-box">
          <input type="text" id="projectFilter" class="combo-input"
                 role="combobox" aria-expanded="false" aria-controls="projectFilterList"
                 aria-autocomplete="list" aria-describedby="projectComboHint"
                 autocomplete="off" spellcheck="false" placeholder="All projects">
          <button type="button" class="combo-toggle" id="projectFilterToggle"
                  tabindex="-1" aria-label="Show every project">▾</button>
          <ul class="combo-list hidden" id="projectFilterList" role="listbox"
              aria-label="Projects"></ul>
        </span>
        <span class="visually-hidden" id="projectComboHint">Type to filter the list. Use the arrow keys to choose a project, Enter to apply it.</span>
      </span>

      <span class="control">
        <label for="lifeFilter">Session</label>
        <select id="lifeFilter" title="Filter by session state. “Idle” means no activity for over 4 hours and no end signal — possibly still open, possibly exited without firing its SessionEnd hook.">
          <option value="">Any state</option>
          <option value="live">Live</option>
          <option value="idle">Idle</option>
          <option value="ended">Ended</option>
        </select>
      </span>

      <span class="control">
        <label for="cmdFilter">Command</label>
        <select id="cmdFilter" title="Filter by the bookkeeping slash commands a session ran (/git-review, /git-commit-message). Options appear only for commands actually recorded on the board.">
          <option value="">Any command</option>
        </select>
      </span>

      <!-- role=status so changing the filter announces the result: the board is
           rebuilt wholesale, which a screen reader would otherwise not report. -->
      <span class="refresh-note filter-note" id="lifeNote" role="status" aria-live="polite"></span>

      <!-- Not `disabled` when there is nothing to reset: a button that goes
           disabled under the press that emptied it drops focus in most
           browsers. aria-disabled says the same thing and keeps focus put; the
           handler no-ops and says so in the live region above. -->
      <button type="button" class="ghost small" id="resetFilters" aria-disabled="true">↺ Reset filters</button>

      <label class="toggle"><input type="checkbox" id="showDone"> Show done</label>
      <label class="toggle"><input type="checkbox" id="fillWidth"> Fill width</label>
      <span class="btn-group">
        <button type="button" class="ghost small" id="expandAll" title="Expand all cards">⤢ Expand all</button>
        <button type="button" class="ghost small" id="collapseAll" title="Collapse all cards">⤡ Collapse all</button>
      </span>
      <button type="button" class="ghost small" id="addColumn">＋ Column</button>
      <button type="button" class="ghost small" id="archiveDone">Dump done → archive</button>
    </div>
  </header>

  <div id="usageStrip" class="usage-strip hidden"></div>

  <!-- One <main> holding all three panels, rather than role=tabpanel on <main>
       itself: that would override the landmark and leave the page with none. -->
  <main id="viewPanels" class="views" tabindex="-1">
    <div id="boardView" class="board" role="tabpanel" aria-labelledby="tabBoard" tabindex="0">
      <!-- columns injected by app.js -->
    </div>

    <section id="projectsSection" class="projects-view hidden" role="tabpanel" aria-labelledby="tabProjects" tabindex="0">
      <div class="projects-head">
        <h2>All projects</h2>
        <span class="control projects-search">
          <label for="projectSearch">Search</label>
          <input type="search" id="projectSearch" placeholder="Name or path"
                 autocomplete="off" spellcheck="false">
        </span>
        <!-- role=status: the table is rebuilt wholesale as you type, so the
             match count is the only thing that reports the result. Written only
             when the text actually changes, so a background refresh does not
             re-announce the same sentence. -->
        <p class="projects-sub" id="projectsSub" role="status" aria-live="polite"></p>
      </div>
      <div class="table-scroll" tabindex="0" role="region" aria-label="All projects">
        <table class="projects-table" id="projectsTable">
          <caption class="visually-hidden">Every project a Claude session has run in, with its session counts and most recent session.</caption>
          <thead>
            <tr>
              <th scope="col"><button type="button" class="th-sort" data-sort="name">Project</button></th>
              <th scope="col"><button type="button" class="th-sort" data-sort="sessions">Sessions</button></th>
              <th scope="col">Last session</th>
              <th scope="col"><button type="button" class="th-sort" data-sort="recent">Last active</button></th>
              <th scope="col">Links</th>
            </tr>
          </thead>
          <tbody id="projectsBody"></tbody>
        </table>
      </div>
    </section>

    <section id="archiveSection" class="archive-view hidden" role="tabpanel" aria-labelledby="tabArchive" tabindex="0">
      <h2>Archived (done) sessions</h2>
      <div class="archive-list" id="archiveList"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
